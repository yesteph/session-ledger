<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Ledger</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
  --accent: #c2410c; --accent-soft: #fdeee6;
  --pending: #b45309; --pending-bg: #fef3c7;
  --decision: #1d4ed8; --decision-bg: #dbeafe;
  --done: #15803d; --done-bg: #dcfce7;
  --abandoned: #6b7280; --abandoned-bg: #f3f4f6;
  --stale: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --line: #33332f;
    --accent: #fb923c; --accent-soft: #3a2316;
    --pending: #fbbf24; --pending-bg: #3a2e10; --decision: #93c5fd; --decision-bg: #172a4a;
    --done: #86efac; --done-bg: #12321f; --abandoned: #a1a1aa; --abandoned-bg: #2a2a2e; --stale: #f87171;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 0; }
h1 { font-size: 16px; margin: 0 0 10px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
h1 small { color: var(--muted); font-weight: 400; font-size: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tab { border: 0; background: none; color: var(--muted); padding: 8px 12px; cursor: pointer; font: inherit;
  border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; margin-left: 4px; }
.bar { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; align-items: center; }
select, input[type=search], textarea { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
input[type=search] { flex: 1; min-width: 180px; }
main { padding: 0 16px 80px; max-width: 1100px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  margin-bottom: 8px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
.item.sel { border-color: var(--accent); background: var(--accent-soft); }
.item input[type=checkbox] { margin-top: 3px; }
.text { white-space: pre-wrap; word-break: break-word; }
.meta { grid-column: 2; display: flex; gap: 6px 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; align-items: center; }
.pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; }
.pill.pending { color: var(--pending); background: var(--pending-bg); }
.pill.decision { color: var(--decision); background: var(--decision-bg); }
.pill.done { color: var(--done); background: var(--done-bg); }
.pill.abandoned { color: var(--abandoned); background: var(--abandoned-bg); }
.stale { color: var(--stale); font-weight: 600; }
.chip { border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; cursor: pointer; background: none;
  color: var(--muted); font: inherit; font-size: 12px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { color: var(--text); border-color: var(--muted); }
.actions { margin-left: auto; display: flex; gap: 4px; }
button.btn { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 6px; padding: 3px 8px; cursor: pointer; }
button.btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.evidence { grid-column: 2; font-size: 12px; color: var(--muted); }
.pair { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.pair .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 10px; }
.pair .cols > div { border-left: 3px solid var(--line); padding-left: 8px; }
.verdict { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill.duplicate { color: var(--accent); background: var(--accent-soft); }
.pill.resolves { color: var(--done); background: var(--done-bg); }
.pill.related, .pill.unrelated, .pill.unjudged { color: var(--abandoned); background: var(--abandoned-bg); }
@media (max-width: 700px) { .pair .cols { grid-template-columns: 1fr; } }
.selbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 10px 16px; display: none; gap: 8px; align-items: center; z-index: 6; }
.selbar.on { display: flex; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; width: min(640px, 92vw); }
dialog textarea { width: 100%; min-height: 110px; }
dialog .row { display: flex; gap: 8px; margin: 10px 0; align-items: center; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
.sess { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.sess h3 { margin: 0 0 4px; font-size: 14px; }
.subj { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.subj h3 { margin: 0 0 2px; font-size: 14px; }
.subj .desc { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.subj.merged { opacity: .6; }
.section { margin-bottom: 14px; }
.section > summary { list-style: none; cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  padding: 8px 2px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.section > summary::-webkit-details-marker { display: none; }
.section > summary h2 { font-size: 15px; margin: 0; }
.section > summary h2::before { content: "▾ "; color: var(--muted); }
.section:not([open]) > summary h2::before { content: "▸ "; }
.section > summary .meta { grid-column: auto; flex: 1; }
.chip.subject { color: var(--text); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-bottom: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; }
.tile .s { font-size: 12px; color: var(--muted); }
.status { font-weight: 600; }
.status.ok { color: var(--done); } .status.warn { color: var(--pending); } .status.bad { color: var(--stale); }
h2.mon { font-size: 14px; margin: 18px 0 8px; }
table.mon { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  font-size: 13px; font-variant-numeric: tabular-nums; }
table.mon th, table.mon td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.mon th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.mon td.n, table.mon th.n { text-align: right; }
.tablewrap { overflow-x: auto; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; position: relative; }
.chart svg { display: block; width: 100%; height: 140px; }
.chart .bar { fill: var(--accent); }
.chart .hit:hover + .bar, .chart .bar.on { opacity: .75; }
.chart .axis { stroke: var(--line); }
.chart text { fill: var(--muted); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 8px;
  border-radius: 4px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
pre.log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12px;
  overflow: auto; max-height: 360px; white-space: pre-wrap; }
.toast { position: fixed; top: 12px; right: 12px; background: var(--text); color: var(--bg); padding: 6px 12px; border-radius: 6px;
  opacity: 0; transition: opacity .2s; z-index: 10; }
.toast.on { opacity: 1; }
code { font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Session Ledger <small id="summary"></small></h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="bar">
  <select id="project"><option value="">All projects</option></select>
  <select id="subject" title="Subject"><option value="">All subjects</option></select>
  <input type="search" id="q" placeholder="Search items…">
  <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="staleOnly"> stale only</label>
  <select id="label" title="Judge verdict (duplicates tab)">
    <option value="actionable">duplicate + resolves</option><option value="duplicate">duplicate</option>
    <option value="resolves">resolves</option><option value="unjudged">not judged yet</option>
    <option value="related">related</option><option value="unrelated">unrelated</option><option value="all">all candidates</option>
  </select>
</div>
<main id="main"></main>
<div class="selbar" id="selbar">
  <span id="selcount"></span>
  <button class="btn primary" id="mergeSel">Merge selected…</button>
  <button class="btn" id="clearSel">Clear</button>
</div>
<dialog id="mergeDlg">
  <form method="dialog">
    <h3 style="margin-top:0">Merge items</h3>
    <div class="row">Keep as canonical: <select id="canon"></select></div>
    <div class="row">Type: <select id="mtype">
      <option>pending</option><option>decision</option><option>done</option><option>abandoned</option></select></div>
    <textarea id="mtext"></textarea>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" value="ok" id="mergeOk">Merge</button>
    </div>
  </form>
</dialog>
<dialog id="pickDlg">
  <form method="dialog">
    <h3 style="margin-top:0" id="pickTitle"></h3>
    <div class="row"><select id="pickSel" style="width:100%"></select></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" value="ok">OK</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
const STALE_DAYS = 14;
const TABS = [
  ["subjects", "Subjects"], ["pending", "Pending"], ["decision", "Decided"], ["done", "Done"], ["abandoned", "Abandoned"],
  ["dupes", "Review duplicates"], ["sessions", "Sessions"], ["merges", "Merge log"], ["monitor", "Monitor"],
];
let M = null;  // monitoring snapshot, loaded on demand
let S = { items: [], sessions: [], subjects: [], sections: [], candidates: [], merges: [] };
let collapsed = new Set();
try { collapsed = new Set(JSON.parse(localStorage.getItem("ledger.collapsed") || "[]")); } catch {}
let tab = "subjects";
const sel = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const day = ts => ts ? ts.slice(0, 10) : "?";
const ageDays = ts => ts ? Math.floor((Date.now() - Date.parse(ts)) / 864e5) : null;
const isStale = it => it.type === "pending" && ageDays(it.last_seen_at || it.raised_at) > STALE_DAYS;
const sessById = () => Object.fromEntries(S.sessions.map(s => [s.id, s]));

try { tab = localStorage.getItem("ledger.tab") || tab; } catch {}

async function load() {
  S = await (await fetch("/api/state")).json();
  const projects = [...new Set(S.items.map(i => i.project).filter(Boolean))].sort();
  const cur = $("project").value;
  $("project").innerHTML = `<option value="">All projects</option>` + projects.map(p => `<option ${p === cur ? "selected" : ""}>${esc(p)}</option>`).join("");
  const cs = $("subject").value;
  const opt = (v, l) => `<option value="${v}" ${v === cs ? "selected" : ""}>${esc(l)}</option>`;
  $("subject").innerHTML = opt("", "All subjects") + opt("none", "Unclassified") +
    sectionGroups().map(g => `<optgroup label="${esc(g.name)}">` + (g.id ? opt(`sec:${g.id}`, `All of ${g.name}`) : "") +
      g.subjects.map(x => opt(String(x.id), x.name)).join("") + "</optgroup>").join("");
  for (const id of [...sel]) if (!S.items.find(i => i.id === id)) sel.delete(id);
  render();
}

async function post(path, body, msg) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { toast(j.error || "error"); return false; }
  toast(msg); await load(); return true;
}

function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1600); }

const activeSubjects = () => S.subjects.filter(x => !x.merged_into);
const subjById = () => Object.fromEntries(S.subjects.map(x => [x.id, x]));

/** Active subjects grouped by section, in section order; unsectioned last. */
function sectionGroups() {
  const known = new Set(S.sections.map(x => x.id));
  const byName = (a, b) => a.name.localeCompare(b.name);
  const groups = S.sections.map(sec => ({ id: sec.id, name: sec.name,
    subjects: activeSubjects().filter(x => x.section_id === sec.id).sort(byName) }));
  const rest = activeSubjects().filter(x => !known.has(x.section_id)).sort(byName);
  if (rest.length) groups.push({ id: null, name: "Unsectioned", subjects: rest });
  return groups;
}

function filtered() {
  const p = $("project").value, q = $("q").value.toLowerCase(), staleOnly = $("staleOnly").checked, sj = $("subject").value;
  return S.items.filter(i => (!p || i.project === p) && (!q || i.text.toLowerCase().includes(q)) && (!staleOnly || isStale(i))
    && (!sj || (sj === "none" ? !i.subject_id
      : sj.startsWith("sec:") ? String(subjById()[i.subject_id]?.section_id) === sj.slice(4)
      : String(i.subject_id) === sj)));
}

function labelMatch(c) {
  const want = $("label").value, l = c.label || "unjudged";
  return want === "all" || (want === "actionable" ? ["duplicate", "resolves"].includes(l) : l === want);
}

function renderTabs() {
  const f = filtered();
  const count = k => ["pending", "decision", "done", "abandoned"].includes(k) ? f.filter(i => i.type === k).length
    : k === "monitor" ? (M && (M.failed_7d || !M.hook.installed || !M.schedule.loaded) ? "!" : "")
    : k === "subjects" ? activeSubjects().length
    : k === "dupes" ? S.candidates.filter(labelMatch).length : k === "sessions" ? S.sessions.length : S.merges.filter(m => !m.undone_at).length;
  $("tabs").innerHTML = TABS.map(([k, l]) => `<button class="tab ${k === tab ? "on" : ""}" data-tab="${k}">${l}<span class="n">${count(k)}</span></button>`).join("");
  const pend = S.items.filter(i => i.type === "pending");
  const extracted = S.sessions.filter(s => s.extracted).length;
  $("summary").textContent = `${pend.length} pending (${pend.filter(isStale).length} stale) · ${extracted}/${S.sessions.length} sessions extracted`;
}

function sessionChips(it) {
  const by = sessById();
  return it.sessions.map(id => {
    const s = by[id] || {};
    return `<button class="chip" data-session="${id}" title="${esc(s.title || s.first_prompt || id)}">${esc(s.title || id.slice(0, 8))}</button>`;
  }).join("");
}

function itemHtml(it, { selectable = true, actions = true } = {}) {
  const age = ageDays(it.raised_at);
  const dates = it.type === "pending"
    ? `raised ${day(it.raised_at)} · last seen ${day(it.last_seen_at)} · <span class="${isStale(it) ? "stale" : ""}">${age}d open</span>`
    : `raised ${day(it.raised_at)} → ${it.type === "abandoned" ? "dropped" : "resolved"} ${day(it.resolved_at)}`;
  return `<div class="item ${sel.has(it.id) ? "sel" : ""}" data-id="${it.id}">
    ${selectable ? `<input type="checkbox" data-sel="${it.id}" ${sel.has(it.id) ? "checked" : ""} aria-label="select">` : "<span></span>"}
    <div class="text">${esc(it.text)}</div>
    ${it.evidence ? `<div class="evidence">evidence: ${esc(it.evidence)}</div>` : ""}
    <div class="meta">
      <span class="pill ${it.type}">${it.type}</span>
      <span>${esc(it.project || "")}</span>
      <span>${dates}</span>
      ${it.merged_count ? `<span>merged ×${it.merged_count + 1}</span>` : ""}
      ${it.edited ? `<span title="edited by you; re-extraction keeps it">✎</span>` : ""}
      ${(it.events || []).length ? `<span title="${esc(it.events.map(e => `${day(e.at)} ${e.from} → ${e.to} (${e.source === "user" ? "you" : "session"})`).join("\n"))}">↻ ${esc(it.events.at(-1).from)} → ${esc(it.events.at(-1).to)} ${day(it.events.at(-1).at)}</span>` : ""}
      <button class="chip subject" data-move="${it.id}" title="Move to another subject">▸ ${esc(subjById()[it.subject_id]?.name || "Unclassified")}</button>
      ${sessionChips(it)}
      ${actions ? `<span class="actions">
        <select data-type="${it.id}" aria-label="change type">${["pending", "decision", "done", "abandoned"].map(t => `<option ${t === it.type ? "selected" : ""}>${t}</option>`).join("")}</select>
        <button class="btn" data-edit="${it.id}">Edit</button></span>` : ""}
    </div></div>`;
}

function render() {
  renderTabs();
  $("label").hidden = tab !== "dupes";
  const f = filtered(), m = $("main");
  if (["pending", "decision", "done", "abandoned"].includes(tab)) {
    let list = f.filter(i => i.type === tab);
    list.sort(tab === "pending" ? (a, b) => (a.raised_at || "").localeCompare(b.raised_at || "")
                                : (a, b) => (b.resolved_at || "").localeCompare(a.resolved_at || ""));
    m.innerHTML = list.length ? list.map(i => itemHtml(i)).join("") : `<div class="empty">Nothing here.</div>`;
  } else if (tab === "monitor") {
    if (!M) { m.innerHTML = `<div class="empty">Loading…</div>`; loadMonitor(); return; }
    m.innerHTML = monitorHtml(M);
    wireChart();
  } else if (tab === "subjects") {
    const p = $("project").value, q = $("q").value.toLowerCase();
    const groups = {};
    for (const i of S.items) (groups[i.subject_id || "none"] ||= []).push(i);
    const stats = its => {
      const n = t => its.filter(i => i.type === t).length;
      const last = its.map(i => i.last_seen_at || i.resolved_at || i.raised_at || "").sort().pop();
      return { pending: n("pending"), stale: its.filter(isStale).length, decision: n("decision"), done: n("done"),
               sessions: new Set(its.flatMap(i => i.sessions)).size, last,
               projects: [...new Set(its.map(i => i.project).filter(Boolean))] };
    };
    const rows = activeSubjects().map(x => ({ x, its: groups[x.id] || [] })).map(r => ({ ...r, st: stats(r.its) }))
      .filter(r => (!p || r.st.projects.includes(p)) && (!q || (r.x.name + " " + (r.x.description || "")).toLowerCase().includes(q)))
      .sort((a, b) => b.st.pending - a.st.pending || (b.st.last || "").localeCompare(a.st.last || ""));
    const card = r => `<div class="subj"><h3>${esc(r.x.name)}</h3>
      <div class="desc">${esc(r.x.description || "")}</div>
      <div class="meta" style="grid-column:auto">
        <span class="pill pending">${r.st.pending} pending</span>${r.st.stale ? `<span class="stale">${r.st.stale} stale</span>` : ""}
        <span class="pill decision">${r.st.decision} decided</span><span class="pill done">${r.st.done} done</span>
        <span>${r.st.sessions} sessions · last activity ${day(r.st.last)}</span><span>${esc(r.st.projects.join(", "))}</span>
        <span class="actions">
          <button class="btn primary" data-open="${r.x.id}">Items</button>
          <button class="btn" data-brief="${r.x.id}" title="Copy a markdown brief to continue this subject in a new session">Copy brief</button>
          <button class="btn" data-rename="${r.x.id}">Rename</button>
          <button class="btn" data-ssection="${r.x.id}">Section…</button>
          <button class="btn" data-smerge="${r.x.id}">Merge into…</button>
        </span></div></div>`;
    const unclassified = (groups.none || []).length;
    const merged = S.subjects.filter(x => x.merged_into);
    const sectionHtml = g => {
      const rs = rows.filter(r => g.subjects.includes(r.x));
      if (!rs.length) return "";
      const key = String(g.id ?? "none"), pend = rs.reduce((n, r) => n + r.st.pending, 0);
      const stale = rs.reduce((n, r) => n + r.st.stale, 0);
      return `<details class="section" data-section="${key}" ${collapsed.has(key) ? "" : "open"}>
        <summary><h2>${esc(g.name)}</h2><span class="meta">${rs.length} subjects · ${pend} pending${stale ? ` · <span class="stale">${stale} stale</span>` : ""}
          ${g.id ? `<span class="actions"><button class="btn" data-secrename="${g.id}">Rename</button>
            <button class="btn" data-secdelete="${g.id}">Delete</button></span>` : ""}</span></summary>
        ${rs.map(card).join("")}</details>`;
    };
    m.innerHTML = `<div class="bar" style="padding:0 0 10px"><button class="btn" data-secnew="1">+ New section</button></div>`
      + (rows.length ? sectionGroups().map(sectionHtml).join("") : `<div class="empty">No subjects.</div>`)
      + (unclassified ? `<div class="subj"><h3>Unclassified</h3><div class="meta" style="grid-column:auto">${unclassified} items
          <span class="actions"><button class="btn" data-open="none">Items</button></span></div></div>` : "")
      + merged.map(x => `<div class="subj merged"><div class="meta" style="grid-column:auto">${esc(x.name)} → merged into ${esc(subjById()[x.merged_into]?.name || "#" + x.merged_into)}
          <span class="actions"><button class="btn" data-sunmerge="${x.id}">Unmerge</button></span></div></div>`).join("");
  } else if (tab === "dupes") {
    const byId = Object.fromEntries(S.items.map(i => [i.id, i]));
    const p = $("project").value;
    const pairs = S.candidates.filter(c => byId[c.a] && byId[c.b] && labelMatch(c) && (!p || byId[c.a].project === p || byId[c.b].project === p));
    const pend = c => c.resolver === c.a ? c.b : c.a;
    m.innerHTML = pairs.length ? pairs.map(c => `<div class="pair">
      <div class="verdict"><span class="pill ${c.label || "unjudged"}">${c.label || "not judged"}</span>
        <span>similarity ${c.score}</span>${c.reason ? `<span>${esc(c.reason)}</span>` : ""}</div>
      <div class="cols"><div>${itemHtml(byId[c.a], { selectable: false, actions: false })}</div>
                        <div>${itemHtml(byId[c.b], { selectable: false, actions: false })}</div></div>
      ${c.label === "resolves" && byId[pend(c)]?.type === "pending"
        ? `<button class="btn primary" data-resolve="${pend(c)},${c.resolver}">Close #${pend(c)} as done by #${c.resolver}</button>` : ""}
      <button class="btn ${c.label === "resolves" ? "" : "primary"}" data-pairmerge="${c.a},${c.b}">Merge…</button>
      <button class="btn" data-notdup="${c.a},${c.b}">Not a duplicate</button></div>`).join("")
      : `<div class="empty">No duplicate candidates.</div>`;
  } else if (tab === "sessions") {
    const p = $("project").value;
    m.innerHTML = S.sessions.filter(s => !p || s.project === p).map(s => {
      const its = S.items.filter(i => i.sessions.includes(s.id));
      const n = t => its.filter(i => i.type === t).length;
      return `<div class="sess"><h3>${esc(s.title || s.first_prompt || s.id)}</h3>
        <div class="meta" style="grid-column:auto">${esc(s.project || "")} · ${esc(s.branch || "")} · ${day(s.started_at)} → ${day(s.ended_at)} · ${s.user_msgs} prompts
        · ${s.extracted ? `<span class="pill pending">${n("pending")} pending</span><span class="pill decision">${n("decision")}</span><span class="pill done">${n("done")}</span>` : "not extracted"}
        ${s.extract_error ? `<span class="stale">extract failed</span>` : ""}
        <span class="actions"><button class="btn" data-resume="${s.id}">Copy resume command</button></span></div>
        ${s.summary ? `<div style="margin-top:6px">${esc(s.summary)}</div>` : ""}</div>`;
    }).join("");
  } else if (tab === "merges") {
    const byId = Object.fromEntries(S.items.map(i => [i.id, i]));
    m.innerHTML = S.merges.length ? S.merges.map(ev => `<div class="sess">
      <div class="meta" style="grid-column:auto">${day(ev.at)} · kept #${ev.canonical_id}, absorbed ${JSON.parse(ev.absorbed_ids).map(a => "#" + a).join(", ")}
      ${ev.undone_at ? `· undone ${day(ev.undone_at)}` : `<span class="actions"><button class="btn" data-undo="${ev.id}">Undo</button></span>`}</div>
      <div style="margin-top:6px">${esc(byId[ev.canonical_id]?.text || JSON.parse(ev.before_state).text)}</div></div>`).join("")
      : `<div class="empty">No merges yet.</div>`;
  }
  $("selbar").classList.toggle("on", sel.size > 0);
  $("selcount").textContent = `${sel.size} selected`;
  $("mergeSel").disabled = sel.size < 2;
}

const ago = ts => {
  if (!ts) return "never";
  const s = (Date.now() - Date.parse(ts)) / 1000;
  return s < 90 ? "just now" : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
};
const fmtTok = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n || 0);
const statusHtml = (cls, label) => `<span class="status ${cls}">${{ ok: "✓", warn: "!", bad: "✕" }[cls]} ${esc(label)}</span>`;
const runStatus = st => ({ ok: ["ok", "ok"], failed: ["bad", "failed"], running: ["warn", "running"], queued: ["warn", "queued"] }[st] || ["warn", st]);

async function loadMonitor() {
  try { M = await (await fetch("/api/monitor")).json(); } catch { return; }
  if (tab === "monitor") render(); else renderTabs();
}
setInterval(() => { if (tab === "monitor" && !document.hidden) loadMonitor(); }, 30000);

function monitorHtml(M) {
  const h = M.hook, sc = M.schedule, last = M.runs[0], c = M.corpus;
  const hookTile = `<div class="tile"><div class="k">SessionEnd hook</div>
    <div class="v">${h.installed ? statusHtml("ok", "Installed") : statusHtml("bad", "Not installed")}</div>
    <div class="s">last fired ${ago(h.last)} · ${h.count_24h} in 24 h · ${h.count_7d} in 7 d</div></div>`;
  const schedCls = !sc.loaded ? "bad" : sc.last_exit_code && sc.last_exit_code !== "0" && sc.last_exit_code !== "(never exited)" ? "warn" : "ok";
  const schedTile = `<div class="tile"><div class="k">Hourly schedule (launchd)</div>
    <div class="v">${statusHtml(schedCls, sc.loaded ? (sc.state === "running" ? "Running" : "Loaded") : sc.installed ? "Installed, not loaded" : "Not installed")}</div>
    <div class="s">last run ${ago(sc.last)}${sc.last_status ? ` (${esc(sc.last_status)})` : ""} · ${esc(sc.runs || 0)} runs since load · last exit ${esc(sc.last_exit_code || "-")}</div></div>`;
  const [lc, ll] = last ? runStatus(last.status) : ["warn", "never"];
  const dur = r => r.ended_at ? Math.round((Date.parse(r.ended_at) - Date.parse(r.started_at)) / 1000) + " s" : "-";
  const lastTile = `<div class="tile"><div class="k">Last refresh</div><div class="v">${statusHtml(lc, ll)}</div>
    <div class="s">${last ? `${ago(last.started_at)} · ${esc(last.trigger)} · ${dur(last)}` : "no run recorded"}${M.failed_7d ? ` · <span class="stale">${M.failed_7d} failed in 7 d</span>` : ""}</div></div>`;
  const backlog = c.awaiting_extraction + c.extract_errors + c.unembedded;
  const corpusTile = `<div class="tile"><div class="k">Corpus</div>
    <div class="v">${statusHtml(c.extract_errors ? "bad" : backlog ? "warn" : "ok", backlog ? `${backlog} to process` : "Up to date")}</div>
    <div class="s">${c.sessions} sessions · ${c.items} items · ${c.awaiting_extraction} awaiting extraction · ${c.extract_errors} errors ·
      ${c.unembedded} unembedded · ${c.unclassified} unclassified · DB ${(c.db_bytes / 1048576).toFixed(1)} MB</div></div>`;
  const spendTile = (label, x) => `<div class="tile"><div class="k">Claude spend · ${label}</div><div class="v">$${x.cost.toFixed(2)}</div>
    <div class="s">${x.calls} calls${x.failures ? ` · <span class="stale">${x.failures} failed</span>` : ""} · ${fmtTok(x.input_tokens)} in · ${fmtTok(x.output_tokens)} out</div></div>`;
  const table = (cols, rows) => `<div class="tablewrap"><table class="mon"><tr>${cols.map(([l, , n]) => `<th class="${n ? "n" : ""}">${l}</th>`).join("")}</tr>
    ${rows.map(r => `<tr>${cols.map(([, f, n]) => `<td class="${n ? "n" : ""}">${f(r)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  const stepsCell = r => (JSON.parse(r.steps || "[]")).map(x => x.exit ? `<span class="stale">${esc(x.step)} ✕</span>` : `${esc(x.step)} ${x.seconds}s`).join(" · ");
  return `<div class="tiles">${hookTile}${schedTile}${lastTile}${corpusTile}</div>
    <div class="tiles">${spendTile("24 h", M.spend["24h"])}${spendTile("7 days", M.spend["7d"])}${spendTile("30 days", M.spend["30d"])}</div>
    <h2 class="mon">Daily Claude spend, last 30 days <span style="font-weight:400;color:var(--muted)">· tracked since ${M.tracking_since ? M.tracking_since.slice(0, 10) : "-"}</span></h2>
    <div class="chart" id="chart">${chartSvg(M.daily)}<div class="tip" id="tip"></div></div>
    <h2 class="mon">Spend by step (30 days)</h2>
    ${M.by_step.length ? table([["Step", r => esc(r.step)], ["Calls", r => r.calls, 1], ["Failed", r => r.failures || "", 1],
      ["Output tokens", r => fmtTok(r.output_tokens), 1], ["Avg duration", r => r.avg_seconds + " s", 1], ["Cost", r => "$" + r.cost.toFixed(2), 1]], M.by_step) : `<div class="empty">No Claude calls recorded yet.</div>`}
    <h2 class="mon">Spend by model (30 days)</h2>
    ${M.by_model.length ? table([["Model", r => esc(r.model)], ["Calls", r => r.calls, 1], ["Cost", r => "$" + r.cost.toFixed(2), 1]], M.by_model) : ""}
    <h2 class="mon">Refresh runs</h2>
    ${M.runs.length ? table([["Started", r => `${esc(r.started_at.slice(0, 16).replace("T", " "))}<div class="s" style="color:var(--muted);font-size:12px">${ago(r.started_at)}</div>`],
      ["Trigger", r => esc(r.trigger) + (r.session_title || r.session_id ? `<div style="color:var(--muted);font-size:12px">${esc(r.session_title || r.session_id.slice(0, 8))}${r.reason ? " · " + esc(r.reason) : ""}</div>` : "")],
      ["Status", r => statusHtml(...runStatus(r.status)) + (r.passes > 1 ? ` <span style="color:var(--muted)">×${r.passes}</span>` : "")],
      ["Duration", r => dur(r), 1], ["Steps", stepsCell], ["Cost", r => r.cost ? "$" + r.cost.toFixed(3) : "", 1]], M.runs)
      : `<div class="empty">No refresh run recorded yet.</div>`}
    <details class="section" id="logbox"><summary><h2>Refresh log (last 150 lines)</h2></summary><pre class="log" id="log">Loading…</pre></details>`;
}

function chartSvg(daily) {
  const days = [], byDay = Object.fromEntries(daily.map(d => [d.day, d]));
  for (let i = 29; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
    days.push(byDay[d] || { day: d, cost: 0, calls: 0 });
  }
  const W = 600, H = 140, top = 14, bottom = 18, max = Math.max(...days.map(d => d.cost), 0.01);
  const bw = W / days.length, base = H - bottom;
  const bars = days.map((d, i) => {
    const h = d.cost ? Math.max(2, (d.cost / max) * (base - top)) : 0, x = i * bw + 1, w = bw - 2, y = base - h, r = Math.min(4, w / 2, h);
    const path = h ? `M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${base} Z` : "";
    return `<rect class="hit" x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-i="${i}"></rect>
      <path class="bar" data-i="${i}" d="${path}"></path>`;
  }).join("");
  window.__days = days;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily Claude spend, last 30 days">
    <line class="axis" x1="0" x2="${W}" y1="${base}" y2="${base}"></line>
    <text x="0" y="10">$${max.toFixed(2)}</text>
    <text x="0" y="${H - 4}">${days[0].day.slice(5)}</text><text x="${W}" y="${H - 4}" text-anchor="end">today</text>
    ${bars}</svg>`;
}

function wireChart() {
  const chart = $("chart"), tip = $("tip");
  if (!chart) return;
  chart.querySelectorAll(".hit").forEach(el => {
    el.addEventListener("mouseenter", () => {
      const d = window.__days[+el.dataset.i], box = chart.getBoundingClientRect(), r = el.getBoundingClientRect();
      chart.querySelectorAll(".bar").forEach(b => b.classList.toggle("on", b.dataset.i === el.dataset.i));
      tip.textContent = `${d.day} · $${d.cost.toFixed(3)} · ${d.calls} calls`;
      tip.style.left = (r.left - box.left + r.width / 2) + "px"; tip.style.top = "30px"; tip.style.display = "block";
    });
  });
  chart.addEventListener("mouseleave", () => { tip.style.display = "none"; chart.querySelectorAll(".bar.on").forEach(b => b.classList.remove("on")); });
  $("logbox").addEventListener("toggle", async e => {
    if (e.target.open) { $("log").textContent = await (await fetch("/api/log")).text() || "(empty)"; $("log").scrollTop = 1e9; }
  });
}

function pick(title, options, current) {
  return new Promise(resolve => {
    $("pickTitle").textContent = title;
    $("pickSel").innerHTML = options.map(([v, l]) => `<option value="${v}" ${v === current ? "selected" : ""}>${esc(l)}</option>`).join("");
    $("pickDlg").returnValue = "";
    $("pickDlg").onclose = () => resolve($("pickDlg").returnValue === "ok" ? $("pickSel").value : null);
    $("pickDlg").showModal();
  });
}

function openMerge(ids) {
  const its = ids.map(id => S.items.find(i => i.id === id)).sort((a, b) => (a.raised_at || "").localeCompare(b.raised_at || ""));
  $("canon").innerHTML = its.map(i => `<option value="${i.id}">#${i.id} ${esc(i.text.slice(0, 70))}</option>`).join("");
  const sync = () => { const c = its.find(i => i.id == $("canon").value); $("mtext").value = c.text; $("mtype").value = c.type; };
  $("canon").onchange = sync; sync();
  $("mergeDlg").returnValue = "";
  $("mergeDlg").showModal();
  $("mergeDlg").onclose = async () => {
    if ($("mergeDlg").returnValue !== "ok") return;
    const canonical = +$("canon").value;
    if (await post("/api/merge", { canonical, absorbed: its.map(i => i.id).filter(i => i !== canonical),
                                   text: $("mtext").value.trim(), type: $("mtype").value }, "Merged")) sel.clear(), render();
  };
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-edit],[data-session],[data-resume],[data-notdup],[data-pairmerge],[data-undo],[data-resolve],[data-move],[data-open],[data-brief],[data-rename],[data-smerge],[data-sunmerge],[data-ssection],[data-secnew],[data-secrename],[data-secdelete]");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) { tab = d.tab; try { localStorage.setItem("ledger.tab", tab); } catch {} if (tab === "monitor") M = null; render(); }
  else if (d.edit) {
    const it = S.items.find(i => i.id == d.edit);
    const text = prompt("Edit item", it.text);
    if (text && text.trim() !== it.text) post("/api/item", { id: it.id, text: text.trim() }, "Saved");
  }
  else if (d.session || d.resume) {
    const s = sessById()[d.session || d.resume];
    const cmd = `cd ${JSON.stringify(s.cwd || "~")} && claude --resume ${s.id}`;
    try { await navigator.clipboard.writeText(cmd); toast("Resume command copied"); } catch { prompt("Resume command", cmd); }
  }
  else if (d.notdup) { const [a, b] = d.notdup.split(","); post("/api/not-duplicate", { a: +a, b: +b }, "Won't suggest again"); }
  else if (d.pairmerge) openMerge(d.pairmerge.split(",").map(Number));
  else if (d.undo) post("/api/undo", { event: +d.undo }, "Merge undone");
  else if (d.open) { $("subject").value = d.open; tab = "pending"; render(); }
  else if (d.brief) {
    const md = await (await fetch(`/api/brief?subject=${d.brief}`)).text();
    try { await navigator.clipboard.writeText(md); toast("Brief copied"); } catch { prompt("Brief", md); }
  }
  else if (d.rename) {
    const x = subjById()[d.rename], name = prompt("Subject name", x.name);
    if (name && name.trim() !== x.name) post("/api/subject", { id: x.id, name: name.trim() }, "Renamed");
  }
  else if (d.smerge) {
    const x = subjById()[d.smerge];
    const into = await pick(`Merge "${x.name}" into`, activeSubjects().filter(y => y.id !== x.id)
      .sort((a, b) => a.name.localeCompare(b.name)).map(y => [String(y.id), y.name]));
    if (into) post("/api/subject-merge", { from: x.id, into: +into }, "Subjects merged");
  }
  else if (d.ssection) {
    const x = subjById()[d.ssection];
    const to = await pick(`Section for "${x.name}"`, [["none", "Unsectioned"],
      ...S.sections.map(sec => [String(sec.id), sec.name]), ["new", "+ New section…"]], String(x.section_id ?? "none"));
    if (to === null) return;
    let section = to === "none" ? null : +to;
    if (to === "new") {
      const name = prompt("New section name");
      if (!name || !name.trim()) return;
      const r = await (await fetch("/api/section", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name.trim() }) })).json();
      section = r.id;
    }
    post("/api/subject-section", { id: x.id, section }, "Subject moved");
  }
  else if (d.secnew) {
    const name = prompt("New section name");
    if (name && name.trim()) post("/api/section", { name: name.trim() }, "Section created");
  }
  else if (d.secrename) {
    e.preventDefault();
    const sec = S.sections.find(x => x.id == d.secrename), name = prompt("Section name", sec.name);
    if (name && name.trim() !== sec.name) post("/api/section", { id: sec.id, name: name.trim() }, "Section renamed");
  }
  else if (d.secdelete) {
    e.preventDefault();
    const sec = S.sections.find(x => x.id == d.secdelete);
    if (confirm(`Delete section "${sec.name}"? Its subjects become unsectioned.`)) post("/api/section-delete", { id: sec.id }, "Section deleted");
  }
  else if (d.sunmerge) post("/api/subject-unmerge", { id: +d.sunmerge }, "Subject restored");
  else if (d.move) {
    const it = S.items.find(i => i.id == d.move);
    const to = await pick("Move item to subject", [["none", "Unclassified"], ...activeSubjects()
      .sort((a, b) => a.name.localeCompare(b.name)).map(y => [String(y.id), y.name])], String(it.subject_id || "none"));
    if (to !== null) post("/api/item-subject", { id: it.id, subject: to === "none" ? null : +to }, "Item moved");
  }
  else if (d.resolve) { const [pending, resolver] = d.resolve.split(",").map(Number); post("/api/resolve", { pending, resolver }, `#${pending} closed`); }
});
document.addEventListener("change", e => {
  const d = e.target.dataset;
  if (d.sel) { e.target.checked ? sel.add(+d.sel) : sel.delete(+d.sel); render(); }
  else if (d.type) post("/api/item", { id: +d.type, type: e.target.value }, `Marked ${e.target.value}`);
});
document.addEventListener("toggle", e => {
  const key = e.target.dataset?.section;
  if (!key) return;
  e.target.open ? collapsed.delete(key) : collapsed.add(key);
  try { localStorage.setItem("ledger.collapsed", JSON.stringify([...collapsed])); } catch {}
}, true);
["project", "subject", "q", "staleOnly", "label"].forEach(id => $(id).addEventListener("input", render));
$("mergeSel").onclick = () => openMerge([...sel]);
$("clearSel").onclick = () => { sel.clear(); render(); };
load();
</script>
</body>
</html>
