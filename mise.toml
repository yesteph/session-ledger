min_version = "2025.1.0"

[tools]
python = "3.13"   # fastembed/onnxruntime wheels are reliable on 3.13
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install Python dependencies into .venv"
alias = "i"
run = "uv sync"

[tasks.ingest]
description = "Scan Claude Code transcripts into the ledger"
dir = "{{config_root}}/ledger"
run = "python ingest.py"

[tasks.extract]
description = "Extract items from new or changed sessions"
dir = "{{config_root}}/ledger"
run = "python extract.py"

[tasks.embed]
description = "Embed active items whose text changed"
dir = "{{config_root}}/ledger"
run = "python embed.py"

[tasks.judge]
description = "Classify duplicate candidates with Claude"
dir = "{{config_root}}/ledger"
run = "python judge.py"

[tasks.cluster]
description = "File items under subjects (bootstraps the catalog on first run)"
dir = "{{config_root}}/ledger"
run = "python cluster.py"

[tasks.refresh]
description = "Ingest, extract, embed, judge and cluster in one locked pass (used by the SessionEnd hook)"
dir = "{{config_root}}/ledger"
run = "python refresh.py"

[tasks."schedule:install"]
description = "Install the hourly launchd refresh (fallback for sessions that never fire SessionEnd)"
run = "bin/schedule.sh install"

[tasks."schedule:uninstall"]
description = "Remove the hourly launchd refresh"
run = "bin/schedule.sh uninstall"

[tasks."schedule:status"]
description = "Show the launchd refresh state, run count and last exit code"
run = "bin/schedule.sh status"

[tasks.serve]
description = "Serve the review dashboard on http://127.0.0.1:8765"
dir = "{{config_root}}/ledger"
run = "python server.py"
